name: Build APK

# Builds the installable debug APK in the cloud (GitHub-hosted runner already
# has the Android SDK and network access to Google's servers), so no local
# Android SDK / Android Studio is needed. The APK is uploaded as a run artifact
# and also published to a "latest" GitHub Release so it can be downloaded
# without logging in.

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SaltaSveglie.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaltaSveglie-debug-apk
          path: SaltaSveglie.apk
          if-no-files-found: error

      - name: Publish to "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Salta Sveglie (ultima build)
          body: |
            APK di debug scaricabile senza login. Aprilo sul Pixel per installarlo,
            poi aggiungi il widget "Salta Sveglie" alla schermata Home.
          files: SaltaSveglie.apk
          make_latest: true
