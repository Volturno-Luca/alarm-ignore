name: Build APK

# Builds the installable debug APK in the cloud (GitHub-hosted runner already
# has the Android SDK and network access to Google's servers), so no local
# Android SDK / Android Studio is needed. The APK is uploaded as an artifact
# you can download and sideload onto the Pixel.

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaltaSveglie-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
